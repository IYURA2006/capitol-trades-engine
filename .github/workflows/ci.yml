name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: coordinator/go.mod
          cache-dependency-path: coordinator/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock

      - name: Lint
        run: make lint

      - name: Tests (Go against real Postgres, then Python)
        run: make test

      - name: Integration tests (kill and freeze real containers)
        # The fan-out test uses 10,000 children on a laptop; the CI machine is
        # too slow for that inside the time limit, so it uses 2,000 here.
        run: make test-integration
        env:
          TEST_FANOUT_N: "2000"

      - name: One short chaos run, checked against the reference
        run: make chaos N=1

      - name: Stop containers
        if: always()
        run: make down
